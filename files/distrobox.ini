# Manifest for `distrobox assemble create --file`. Managed declaratively by Nix.
# Do not edit manually.
#
# Parser constraints (distrobox 1.8.2.5): `[` `]` in values are section
# boundaries, hence the printf hex escapes below; repeated keys run in order.

[unity-via-distrobox]
image=docker.io/library/ubuntu:22.04
init=true

pre_init_hooks="echo '1/6 Installing base dependencies...' && DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gnupg libasound2 libpulse0"
pre_init_hooks="echo '2/6 Installing libssl1.1 compatibility layer...' && curl -fsSL -o /tmp/libssl1.1.deb http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb && dpkg -i /tmp/libssl1.1.deb && rm -f /tmp/libssl1.1.deb"
pre_init_hooks="echo '3/6 Importing Unity GPG key...' && install -d /etc/apt/keyrings && curl -fsSL https://hub.unity3d.com/linux/keys/public | gpg --dearmor -o /etc/apt/keyrings/unityhub.gpg"
pre_init_hooks="echo '4/6 Adding Unity repository...' && printf 'deb \\x5barch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg\\x5d https://hub.unity3d.com/linux/repos/deb stable main\\n' > /etc/apt/sources.list.d/unityhub.list"
pre_init_hooks="echo '5/6 Installing Unity Hub...' && DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y unityhub"
pre_init_hooks="echo '6/6 Verifying installation...' && command -v unityhub && unityhub --version 2>/dev/null || true"

additional_packages="fonts-noto-cjk"

# entry=0 passes --no-entry: the host desktop entry for the container
# itself is managed by the home-manager module instead.
entry=0

# Browser sign-in redirects need xdg-open to escape back to the host session.
post_init_hooks="rm -f /usr/bin/xdg-open && ln -sf /usr/bin/distrobox-host-exec /usr/bin/xdg-open"
